# Bundle patch for dsh-plugin-usage-board.
#
# Installed into a DSH profile through `dsh plugin --profile <name> add <path>`,
# which records this package in the profile's `dsh.profile.bundles`; the loader
# then applies this file after the shipped bundle layers.
#
# Every row below is restated in full because a patch replaces the targeted
# row's whole `config`.

- insert:
    - id: usage-board
      name: 'dsh-plugin-usage-board'
      config:
        # Snapshot cache lifetime in milliseconds (15s - 300s).
        ttlMs: 60000
        # Also serve the standalone dashboard at /usage-board/.
        servePage: true
        # The API reads credentials, so it stays loopback-only unless a
        # deployment deliberately opts out.
        allowRemote: false
        # Log every upstream fan-out with per-provider outcomes.
        verbose: false
