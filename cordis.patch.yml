# Third-party DSH plugins bundled and pinned by my-dsh-plugins for supply-chain safety.
# Maintained at the repository root because DSH resolves dsh.bundle.patch paths relative to
# the bundle package directory rather than hoisted profile node_modules dependencies.
# Preserves each plugin's upstream default config so profile patch layers remain in control.
- insert:
    # Pinned to audited npm release @dingyi222666/dsh-session-notification@0.2.6
    - id: dsh-session-notification
      name: '@dingyi222666/dsh-session-notification'
    # Pinned to audited npm release dsh-codex-connect@0.2.0-alpha.15 (matches commit 16c7b3e99acd194c2ec0b5d5431930d6f7314b94)
    - id: llm-openai-codex
      name: dsh-codex-connect
      config:
        enableProxy: false
        enableSearch: false
        enableReserveFallback: false
        enableNativeCompaction: false
        enableImageTool: false
        enableImageGeneration: false
        enableAutoReview: false
    # Pinned to audited npm release dsh-quorfloat@0.1.10 (prebuilt Tauri sidecar for
    # macOS/Windows; audit record: docs/audits/dsh-quorfloat-0.1.10.md). No config block:
    # the plugin's own schema defaults (enabled, Alt+Space, panel geometry) apply, so a
    # profile patch layer can still override row `quorfloat` wholesale.
    - id: quorfloat
      name: dsh-quorfloat
